
name: Update Maine Absentee Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * *"

permissions:
  contents: read

concurrency:
  group: maine-absentee-update
  cancel-in-progress: false

jobs:
  validate-absentee:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find latest 2026 absentee report
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error \
            --retry 3 --max-time 60 \
            "https://www.maine.gov/sos/elections-voting/voter-data" \
            -o voter-data-page.html

          python3 - <<'PY'
          import html
          import re
          import urllib.parse
          from pathlib import Path

          page = "https://www.maine.gov/sos/elections-voting/voter-data"

          content = Path("voter-data-page.html").read_text(
              encoding="utf-8",
              errors="replace"
          )

          links = re.findall(
              r'href=["\']([^"\']+\.txt(?:\?[^"\']*)?)["\']',
              content,
              re.IGNORECASE
          )

          matches = []

          for link in links:
              link = html.unescape(link)
              decoded = urllib.parse.unquote(link)

              if re.search(
                  r"11-3-26.*AB.*Voter.*File",
                  decoded,
                  re.IGNORECASE
              ):
                  matches.append(
                      urllib.parse.urljoin(page, link)
                  )

          matches = sorted(set(matches))

          if len(matches) != 1:
              raise RuntimeError(
                  f"Expected exactly one 2026 absentee report, "
                  f"found {len(matches)}: {matches}"
              )

          url = matches[0]

          if urllib.parse.urlparse(url).hostname != "www.maine.gov":
              raise RuntimeError(
                  "Unexpected report download domain."
              )

          Path("report-url.txt").write_text(
              url,
              encoding="utf-8"
          )

          print("Selected report:", url)
          PY

      - name: Download absentee report
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error \
            --retry 3 --max-time 120 \
            "$(cat report-url.txt)" \
            -o absentee_2026.txt

          echo "Report downloaded successfully."

      - name: Verify report format
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("absentee_2026.txt")

          if not path.exists():
              raise RuntimeError("Report file is missing.")

          if path.stat().st_size < 1000000:
              raise RuntimeError(
                  "Downloaded report is unexpectedly small."
              )

          with path.open(
              encoding="utf-8-sig",
              errors="replace"
          ) as f:
              header = next(
                  csv.reader(f, delimiter="|")
              )

          required = {
              "RES MUNICIPALITY",
              "Voter Record #",
              "Req Date",
              "Rec Date",
              "Status"
          }

          if not required.issubset(set(header)):
              raise RuntimeError(
                  "Unexpected absentee report format."
              )

          print("Report format verified.")
          print("File size:", path.stat().st_size, "bytes")
          PY

      - name: Validate against existing dashboard data
        shell: bash
        run: |
          set -euo pipefail

          python3 maine_votes_update_2026.py \
            --source absentee_2026.txt \
            --data data.json \
            --output data_validated.json \
            --check-only

      - name: Remove temporary and voter-level files
        if: always()
        shell: bash
        run: |
          rm -f absentee_2026.txt
          rm -f data_validated.json
          rm -f voter-data-page.html
          rm -f report-url.txt

          echo "Temporary files removed."
